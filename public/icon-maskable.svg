<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Full-bleed background for maskable safe-zone compliance -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- Scaled content inside central 80% safe zone circle (scale 0.75) -->
  <g filter="url(#shadow)" transform="translate(256, 260) scale(0.72)">
    <!-- Steam waves -->
    <path d="M-60 -95 C-70 -125 -50 -145 -60 -175" fill="none" stroke="#fffbeb" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
    <path d="M0 -105 C-12 -135 12 -160 0 -195" fill="none" stroke="#fffbeb" stroke-width="16" stroke-linecap="round" opacity="0.95"/>
    <path d="M60 -95 C50 -125 70 -145 60 -175" fill="none" stroke="#fffbeb" stroke-width="14" stroke-linecap="round" opacity="0.85"/>

    <!-- Bowl Rim & Body -->
    <ellipse cx="0" cy="-35" rx="145" ry="32" fill="#18181b" stroke="#fef3c7" stroke-width="8"/>
    <!-- Food top dome inside bowl -->
    <path d="M-135 -35 C-135 -75 135 -75 135 -35 Z" fill="#fbbf24"/>
    <!-- Bowl Deep Base -->
    <path d="M-140 -35 C-130 90 -70 120 0 120 C70 120 130 90 140 -35 Z" fill="#18181b"/>
    <!-- Bowl Foot Stand -->
    <path d="M-55 120 L-65 145 L65 145 L55 120 Z" fill="#27272a"/>

    <!-- Chopsticks / Fork Accents -->
    <line x1="-100" y1="-80" x2="110" y2="40" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>
    <line x1="-120" y1="-70" x2="90" y2="50" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
